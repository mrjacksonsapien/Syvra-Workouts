services:
  # Throwaway local PostgreSQL. Schema and seed run automatically on the first start
  # (empty volume). Reset with: docker compose down -v
  # The credentials below are dev-only and not secret.
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: syvra
      POSTGRES_PASSWORD: syvra
      POSTGRES_DB: syvra
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U syvra -d syvra']
      interval: 5s
      timeout: 5s
      retries: 10

  # Express API with auto-restart on code changes. http://localhost:3000/health
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      DATABASE_URL: postgres://syvra:syvra@db:5432/syvra
      CORS_ORIGIN: http://localhost:5173
      PORT: 3000
    ports:
      - '3000:3000'
    volumes:
      - ./apps/api/src:/app/apps/api/src
    depends_on:
      db:
        condition: service_healthy

  # Vite dev server with hot reload. http://localhost:5173
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - '5173:5173'
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
    depends_on:
      - api

volumes:
  db-data:
